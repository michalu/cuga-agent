# OpenShell gateway configuration — Kubernetes / OpenShift compute driver.
#
# Used in place of gateway.toml when deploying on OpenShift.
# Key differences from the Rancher Desktop config:
#   - compute_drivers = ["kubernetes"]   (no Docker socket)
#   - auth.allow_unauthenticated_users = false  (OIDC required)
#   - TLS enabled (disable_tls = false)
#   - gateway_id matches the Secret name used by setup.sh
#
# Mount this file at /etc/openshell/gateway.toml in the gateway Deployment.

[openshell]
version = 1

[openshell.gateway]
bind_address        = "0.0.0.0:8080"
health_bind_address = "0.0.0.0:8081"
log_level           = "info"
compute_drivers     = ["kubernetes"]
# TLS certificates are mounted from the openshell-tls Secret generated by
# the openshell-init initContainer (same generate-certs command as Docker).
disable_tls         = true

[openshell.gateway.auth]
# Local dev / CRC setup
allow_unauthenticated_users = true
# oidc_issuer_url = "https://oauth.apps.<cluster>/oauth"
# oidc_client_id  = "openshell-gateway"

[openshell.gateway.gateway_jwt]
signing_key_path = "/var/lib/openshell/tls/jwt/signing.pem"
public_key_path  = "/var/lib/openshell/tls/jwt/public.pem"
kid_path         = "/var/lib/openshell/tls/jwt/kid"
gateway_id       = "openshell-ocp"
ttl_secs         = 3600

[openshell.drivers.kubernetes]
# The gateway creates sandbox pods in this namespace.
# Must match the namespace where the gateway itself runs.
namespace         = "${NAMESPACE}"
grpc_endpoint     = "http://openshell-gateway.${NAMESPACE}.svc.cluster.local:8080"
# image_pull_policy = "IfNotPresent"
