# OpenShell gateway Deployment.
#
# The gateway runs as a single replica. It uses the Kubernetes compute driver
# to create sandbox pods — no Docker socket needed.
#
# Prerequisites:
#   - ServiceAccount openshell-gateway (rbac.yaml)
#   - PVC openshell-state (pvc.yaml)
#   - ConfigMap gateway-config (generated by kustomize from gateway.toml)
#   - Secret llm-credentials with OPENAI_API_KEY (or equivalent)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openshell-gateway
  namespace: ${NAMESPACE}
  labels:
    app: openshell-gateway
    app.kubernetes.io/part-of: sovereign-sandbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openshell-gateway
  template:
    metadata:
      labels:
        app: openshell-gateway
    spec:
      serviceAccountName: openshell-gateway

      # Generate JWT keys on first start; idempotent — leaves existing keys alone.
      initContainers:
        - name: generate-certs
          image: ghcr.io/nvidia/openshell/gateway:latest
          # TODO: pin to a digest once a stable versioned tag is published
          command:
            - openshell-gateway
            - generate-certs
            - --output-dir=/var/lib/openshell/tls
            - --server-san=127.0.0.1
            - --server-san=localhost
            - --server-san=openshell-gateway.${NAMESPACE}.svc.cluster.local
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: openshell-state
              mountPath: /var/lib/openshell

      containers:
        - name: gateway
          image: ghcr.io/nvidia/openshell/gateway:latest
          # Override CMD so gateway.toml owns every setting.
          command: []
          securityContext:
            runAsUser: 0
          env:
            - name: OPENSHELL_GATEWAY_CONFIG
              value: /etc/openshell/gateway.toml
            - name: OPENSHELL_DISABLE_TLS
              value: "true"
            # SQLite for single-replica. Replace with Postgres URL for HA:
            #   OPENSHELL_DB_URL: postgresql://user:pass@postgres-svc/openshell
            - name: OPENSHELL_DB_URL
              value: "sqlite:/var/lib/openshell/gateway.db?mode=rwc"
            - name: XDG_DATA_HOME
              value: /var/lib/openshell
            - name: HOME
              value: /var/lib/openshell
            # LLM credential injected by the gateway into sandbox egress.
            # The sandbox never sees this value directly.
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-credentials
                  key: OPENAI_API_KEY
          ports:
            - name: grpc
              containerPort: 8080
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: openshell-state
              mountPath: /var/lib/openshell
            - name: gateway-config
              mountPath: /etc/openshell/gateway.toml
              subPath: gateway.toml
              readOnly: true

      volumes:
        - name: openshell-state
          persistentVolumeClaim:
            claimName: openshell-state
        - name: gateway-config
          configMap:
            name: gateway-config

---
apiVersion: v1
kind: Service
metadata:
  name: openshell-gateway
  namespace: ${NAMESPACE}
  labels:
    app: openshell-gateway
    app.kubernetes.io/part-of: sovereign-sandbox
spec:
  selector:
    app: openshell-gateway
  ports:
    - name: grpc
      port: 8080
      targetPort: grpc
    - name: health
      port: 8081
      targetPort: health

---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: openshell-gateway
  namespace: ${NAMESPACE}
  labels:
    app: openshell-gateway
    app.kubernetes.io/part-of: sovereign-sandbox
  annotations:
    haproxy.router.openshift.io/h2c: "true"
spec:
  to:
    kind: Service
    name: openshell-gateway
  port:
    targetPort: grpc
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Allow
