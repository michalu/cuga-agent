# OpenShell gateway configuration — Docker compute driver (Rancher Desktop / Docker Desktop).
#
# Used by docker-compose.yml in this directory.
# Key differences from the OpenShift config:
#   - compute_drivers = ["docker"]   (Docker socket, not kube API)
#   - auth.allow_unauthenticated_users = true  (local dev only)
#   - disable_tls = true             (local dev only)
#   - gateway_id = "openshell-docker"
#
# Mount this file at /etc/openshell/gateway.toml in the gateway container.

[openshell]
version = 1

[openshell.gateway]
bind_address        = "127.0.0.1:8080"
health_bind_address = "127.0.0.1:8081"
log_level           = "info"
compute_drivers     = ["docker"]
disable_tls         = true

[openshell.gateway.auth]
# Local development only. Anyone who can reach the gateway can drive it.
allow_unauthenticated_users = true

# Required by the docker driver — without this section the gateway refuses to
# provision with "docker sandboxes require gateway JWT auth". Keys are generated
# by the `openshell-init` service in docker-compose.yml.
[openshell.gateway.gateway_jwt]
signing_key_path = "/var/lib/openshell/tls/jwt/signing.pem"
public_key_path  = "/var/lib/openshell/tls/jwt/public.pem"
kid_path         = "/var/lib/openshell/tls/jwt/kid"
gateway_id       = "openshell-docker"
ttl_secs         = 3600

[openshell.drivers.docker]
default_image     = "ghcr.io/nvidia/openshell-community/sandboxes/base:latest"
supervisor_image  = "ghcr.io/nvidia/openshell/supervisor:latest"
image_pull_policy = "IfNotPresent"
sandbox_namespace = "openshell"
# Sandboxes call back here. The driver replaces the host with
# host.openshell.internal and the port with the gateway's own bind port, so the
# gateway must be published on 8080 on the Docker host.
grpc_endpoint     = "http://host.openshell.internal:8080"
