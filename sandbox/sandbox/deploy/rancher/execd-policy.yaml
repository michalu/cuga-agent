version: 1

# OpenShell policy for the code-execution sandbox — Rancher Desktop / Docker variant.
#
# Identical to the OpenShift variant except:
#   Kubernetes Service DNS  →  host.openshell.internal
#
# The relay (sandbox-relay.py) bridges the gap: sandboxes reach
# host.openshell.internal:PORT, the relay forwards to the macOS host where
# `openshell forward` binds. On Kubernetes pods address each other directly
# and neither the relay nor this hostname is needed.

filesystem_policy:
  include_workdir: true
  read_only:
    - /bin
    - /etc
    - /lib
    - /opt/opensandbox
    - /proc
    - /sys
    - /usr
    - /dev/urandom
  read_write:
    - /sandbox
    - /workspace
    - /run/execd
    - /tmp
    - /dev/null

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  execd_api:
    name: execd-api
    endpoints:
      # execd's own HTTP API, and the loopback Jupyter it drives.
      - host: 127.0.0.1
        ports: [44772, 54321]
        protocol: rest
        enforcement: enforce
        access: full
      - host: localhost
        ports: [44772, 54321]
        protocol: rest
        enforcement: enforce
        access: full
    binaries:
      - { path: /usr/local/bin/execd }
      - { path: /usr/local/bin/execd-entrypoint }
      - { path: /usr/local/bin/python* }

  # CUGA's tool registry. Code generated by the agent calls tools through it,
  # so without this the agent can run code but every tool call fails. Reached
  # through the relay, which bridges to the host-side `openshell forward`.
  cuga_tool_registry:
    name: cuga-tool-registry
    endpoints:
      - host: host.openshell.internal
        port: 8001
        protocol: rest
        enforcement: enforce
        access: full
    binaries:
      - { path: /usr/local/bin/execd }
      - { path: /usr/local/bin/python* }
      - { path: /workspace/*/.venv/bin/python* }

  # Package installs for agent-written code.  Egress is deny-by-default, so an
  # index that is not listed here is unreachable no matter what
  # advanced_features.execd_package_index says.  pip/uv fetch metadata from the
  # index host and the wheels themselves from the file host — both are needed.
  # Air-gapped deployments: replace both with your internal mirror.
  python_package_index:
    name: python-package-index
    endpoints:
      - host: pypi.org
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-write
      - host: files.pythonhosted.org
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-write
    binaries:
      - { path: /usr/local/bin/uv }
      - { path: /usr/local/bin/python* }
      - { path: /workspace/*/.venv/bin/python* }
      - { path: /workspace/*/.venv/bin/pip* }

  # Session code may call the LLM without ever seeing a credential — the
  # gateway injects it. Drop this block to deny generated code any egress.
  openshell_inference:
    name: openshell-inference-local
    endpoints:
      - host: inference.local
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-write
    binaries:
      - { path: /usr/local/bin/python* }
      - { path: /workspace/*/.venv/bin/python* }
